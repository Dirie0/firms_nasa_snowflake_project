[project]
name = "firms-snowflake-project"
version = "0.1.0"
description = "NASA FIRMS (VIIRS NOAA-20 NRT) fire data: extract, transform and split to S3 for Snowflake"
authors = [
    {name = "Dirie", email = "dirieisse0@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "boto3 (>=1.43.114,<2.0.0)",
    "geopandas (>=1.2.0,<2.0.0)",
    "shapely (>=2.2.0,<3.0.0)",
    "pyogrio (>=0.13.0,<0.14.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
